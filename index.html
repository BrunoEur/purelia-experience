<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PURELIA Experience</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
      }

      body {
        background: black;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
      }

      .video-container {
        width: 100%;
        height: 100dvh;
        flex-shrink: 0;
        position: relative;
        overflow: hidden;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.15) translateY(-5%);
      }

      .watermark-cover {
        width: 100%;
        height: 80px;
        background: black;
        flex-shrink: 0;
      }

      /* Optimización para móviles */
      @media (max-width: 768px) {
        video {
          width: 100vw;
          height: 100vh;
          object-fit: cover;
        }
      }
    </style>
  </head>
  <body>
    <div class="video-container">
      <video autoplay muted loop playsinline>
        <source src="video.mp4" type="video/mp4" />
        Tu navegador no soporta videos HTML5
      </video>
    </div>
    <div class="watermark-cover"></div>
  </body>
</html>
